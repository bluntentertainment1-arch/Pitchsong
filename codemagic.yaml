workflows:
  # Run this first. It only compiles the app (no signing), so compile errors show up quickly.
  ios-build-check:
    name: Pitchsong build check (no signing)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Pitchsong.xcodeproj"
        XCODE_SCHEME: "Pitchsong"
    scripts:
      - name: Build for iPhone and iPad simulators
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  ios-release:
    name: Pitchsong iOS release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: appleapi
    environment:
      xcode: latest
      groups:
        - pitchsong        # must contain CERTIFICATE_PRIVATE_KEY
      vars:
        XCODE_PROJECT: "Pitchsong.xcodeproj"
        XCODE_SCHEME: "Pitchsong"
        BUNDLE_ID: "com.kidblunt.pitchsong"
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number
        script: |
          BUILD_NUMBER=$(date +%s)
          agvtool new-version -all "$BUILD_NUMBER"
          echo "Build number set to: $BUILD_NUMBER"

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
